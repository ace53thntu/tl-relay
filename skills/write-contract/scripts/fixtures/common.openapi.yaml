openapi: 3.1.0
info:
  title: Demo shared components
  version: 0.1.0
  license:
    name: Proprietary
    identifier: LicenseRef-Proprietary
components:
  schemas:
    Error:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: object
          additionalProperties: false
          required: [code, message, traceId]
          properties:
            code:
              type: string
              pattern: '^[A-Z][A-Z0-9_]*$'
            message:
              type: string
            traceId:
              type: string
            details:
              type: array
              items:
                type: object
                additionalProperties: false
                required: [field, reason]
                properties:
                  field:
                    type: string
                  reason:
                    type: string
  parameters:
    Page:
      name: page
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        default: 1
      example: 1
    PageSize:
      name: pageSize
      in: query
      required: false
      schema:
        type: integer
        enum: [10, 20, 50, 100]
        default: 20
      example: 20
  responses:
    Unauthenticated:
      description: No session, or the session has expired
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            unauthenticated:
              value:
                error:
                  code: UNAUTHENTICATED
                  message: Sign in again.
                  traceId: 4bf92f3577b34da6a3ce929d0e0e4736
    Forbidden:
      description: The session's role may not call this route
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            forbidden:
              value:
                error:
                  code: FORBIDDEN
                  message: You do not have access to this action.
                  traceId: 4bf92f3577b34da6a3ce929d0e0e4736
