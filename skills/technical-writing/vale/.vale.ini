# Vale gate for the technical-writing skill.
# styles/Google is a disk copy of the official package, synced on 2026-10-02. Vale downloads nothing at lint time.
# Error blocks the gate. Warning is advice. A rule set to NO produced noise on the 25-page baseline.
StylesPath = styles
MinAlertLevel = warning
Vocab = AiSdlc

[*.md]
BasedOnStyles = Google, AiSdlc

Google.Latin = error
Google.Will = error
Google.LyHyphens = error

Google.Units = warning
Google.Timeless = warning
Google.ExcessiveClaims = warning
Google.Anthropomorphism = warning
Google.Quotes = warning
Google.We = warning
Google.FirstPerson = warning
Google.Exclamation = warning
Google.WordList = warning

Google.Acronyms = NO
Google.EmDash = NO
Google.Passive = NO
Google.Semicolons = NO
Google.Parens = NO
Google.Contractions = NO
Google.WordListCase = NO
Google.Colons = NO
Google.OxfordComma = NO
Google.Headings = NO
Google.HeadingPunctuation = NO
Google.Spelling = NO
