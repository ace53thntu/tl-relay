# Copy to `.tl-relay/config.yaml` in a workspace, or to `~/.tl-relay/config.yaml`.
# Every key is optional; a missing file or key means the default shown here.

# A shared hub that skills read, and that receives ADRs, glossary terms and index entries.
# Unset: skills skip every hub step.
# knowledge_dir: _knowledge

# Root of the runtime store. Specs, plans, design sets and plan runs live under <state_dir>/<workspace>/. Worktrees fall back to <state_dir>/worktrees.
state_dir: ~/.tl-relay

# Worktree root after $WORKTREE_ROOT. Unset: worktrees fall back to <state_dir>/worktrees.
# worktree_dir: ~/worktrees

# Language of the questions tl-design and tl-implement ask the operator.
operator_language: en

# tl-design step 12. Unset: the step reports a skip.
# publish:
#   command: "<command with {dir} {target}>"   # {dir} is the staged tree, {target} the target you name
#   confirm_flag: "--yes"                      # added after the dry run you confirm
#   keep: [page_ids]                           # frontmatter blocks the publish command writes back; a restage keeps them

# tl-implement step 9. Unset: the ticket comment reports a skip.
# tracker:
#   comment: "<command with {target} {body_file}>"   # {target} is the ticket key, {body_file} the comment body path
#   confirm_flag: "--yes"

# technical-writing. Unset: Vale runs with the shipped vocabulary only.
# vale:
#   vocab: path/to/accept.txt
