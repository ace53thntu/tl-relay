name: test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  suites:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install jq, Ruby and the ingest-sources requirements
        run: |
          sudo apt-get update
          sudo apt-get install -y jq ruby
          /usr/bin/ruby --version
          /usr/bin/python3 -m pip install --user --break-system-packages -r skills/ingest-sources/requirements.txt

      - name: Install Vale
        run: |
          VALE_VERSION=3.28.1
          curl -fsSL -o "$RUNNER_TEMP/vale.tar.gz" "https://github.com/errata-ai/vale/releases/download/v${VALE_VERSION}/vale_${VALE_VERSION}_Linux_64-bit.tar.gz"
          mkdir -p "$RUNNER_TEMP/bin"
          tar -xzf "$RUNNER_TEMP/vale.tar.gz" -C "$RUNNER_TEMP/bin" vale
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      - name: Put a stub claude first on PATH
        if: ${{ !cancelled() }}
        run: |
          mkdir -p "$RUNNER_TEMP/bin"
          cp maintainer/ci/stub-claude "$RUNNER_TEMP/bin/claude"
          chmod +x "$RUNNER_TEMP/bin/claude"
          echo "CLAUDE_STUB_LOG=$RUNNER_TEMP/claude-calls.log" >> "$GITHUB_ENV"
          : > "$RUNNER_TEMP/claude-calls.log"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      - name: skills/tests
        if: ${{ !cancelled() }}
        run: /usr/bin/python3 -m unittest discover -s "$GITHUB_WORKSPACE/skills/tests" -p 'test_*.py'

      - name: maintainer/runtime/tests
        if: ${{ !cancelled() }}
        run: /usr/bin/python3 -m unittest discover -s "$GITHUB_WORKSPACE/maintainer/runtime/tests" -p 'test_*.py'

      - name: maintainer/hooks/tests
        if: ${{ !cancelled() }}
        run: sh maintainer/hooks/tests/run.sh

      - name: Skill script suites
        if: ${{ !cancelled() }}
        run: |
          status=0
          for s in ingest-sources tl-design write-contract write-task-breakdown; do
            /usr/bin/python3 -m unittest discover -s "$GITHUB_WORKSPACE/skills/$s/scripts" -p 'test_*.py' || status=1
          done
          exit $status

      - name: Retro script suite
        if: ${{ !cancelled() }}
        run: /usr/bin/python3 -m unittest discover -s "$GITHUB_WORKSPACE/maintainer/skills/retro/scripts" -p 'test_*.py'

      - name: Vale gate
        if: ${{ !cancelled() }}
        run: sh skills/technical-writing/vale/test.sh

      - name: No suite called claude
        if: always()
        run: |
          if [ -z "${CLAUDE_STUB_LOG:-}" ]; then
            echo "the stub claude step did not run"
            exit 1
          fi
          if [ -s "$CLAUDE_STUB_LOG" ]; then
            echo "claude was called:"
            cat "$CLAUDE_STUB_LOG"
            exit 1
          fi
